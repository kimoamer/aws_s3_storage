name: CI

on:
  push:
    branches: [version-15]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ruff
        run: pip install ruff
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .

  tests:
    name: Bench tests
    runs-on: ubuntu-22.04
    timeout-minutes: 40

    services:
      mariadb:
        image: mariadb:10.6
        env:
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15

    steps:
      - uses: actions/checkout@v4
        with:
          path: aws_s3_storage

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libmysqlclient-dev redis-server
          npm install -g yarn

      - name: Configure MariaDB
        run: |
          mysql -h 127.0.0.1 -u root -proot -e "SET GLOBAL character_set_server = 'utf8mb4'"
          mysql -h 127.0.0.1 -u root -proot -e "SET GLOBAL collation_server = 'utf8mb4_unicode_ci'"

      - name: Install bench
        run: pip install frappe-bench

      - name: Create bench and site
        run: |
          bench init --skip-redis-config-generation --frappe-branch version-15 \
            --python "$(which python)" frappe-bench
          cd frappe-bench
          bench set-config -g db_host 127.0.0.1
          bench set-config -g redis_cache redis://127.0.0.1:6379
          bench set-config -g redis_queue redis://127.0.0.1:6379
          bench set-config -g redis_socketio redis://127.0.0.1:6379
          bench new-site test_site \
            --db-root-password root --admin-password admin --no-mariadb-socket

      - name: Install the app
        run: |
          cd frappe-bench
          bench get-app aws_s3_storage "$GITHUB_WORKSPACE/aws_s3_storage"
          bench --site test_site install-app aws_s3_storage

      - name: Run tests
        run: |
          cd frappe-bench
          bench --site test_site set-config allow_tests true
          bench --site test_site run-tests --app aws_s3_storage
